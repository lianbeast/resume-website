    <circle cx="360" cy="24" r="3.5"/>
    <circle cx="480" cy="24" r="3.5"/>
    <circle cx="600" cy="24" r="4.5"/>
    <circle cx="720" cy="24" r="3.5"/>
    <circle cx="840" cy="24" r="3.5"/>
    <circle cx="960" cy="24" r="3.5"/>
    <circle cx="1080" cy="24" r="3.5"/>
  </g>
  <g fill="#0e7490">
