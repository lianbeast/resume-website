    <path d="M0 24 H120"/>
    <path d="M120 24 L240 24"/>
    <path d="M240 24 L360 24"/>
    <path d="M360 24 L480 24"/>
    <path d="M480 24 L600 24"/>
    <path d="M600 24 L720 24"/>
    <path d="M720 24 L840 24"/>
    <path d="M840 24 L960 24"/>
    <path d="M960 24 L1080 24"/>
    <path d="M1080 24 H1200"/>
  </g>
  <g stroke="#0e7490" stroke-width="1" opacity="0.5">
    <path d="M180 24 L300 14"/>
