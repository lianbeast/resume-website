      --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;

    [data-theme="dark"] {
      --bg: #161412;
      --bg-card: #1e1c1a;
      --text: #f0ede8;
      --text-dim: #9a938d;
      --gold: #e06a3a;

    body { min-height: 100vh; display: flex; flex-direction: column; }

    /* Skip link */

    /* Main nav */

      background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-glass);
    }
    [data-theme="dark"] #main-nav {

    .nav-logo { font-size: 22px; font-weight: 700; color: var(--gold); text-decoration: none; }
    .nav-links { list-style: none; display: flex; align-items: center; gap: 4px; margin: 0; padding: 0; }

    /* Content wrapper */
    .content { position: relative; z-index: 2; padding-top: 60px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 5% 80px; text-align: center; max-width: 600px; margin: 0 auto; }

      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 32px; box-shadow: 0 4px 24px rgba(194, 65, 12, 0.3);
    }
    .success-icon svg { width: 40px; height: 40px; color: #fff; }

    h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 700; line-height: 1.2; margin-bottom: 16px; }
    .lead { font-size: 18px; color: var(--text-dim); margin-bottom: 32px; max-width: 480px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 28px; border-radius: 10px; font-size: 14px; font-weight: 600;
      text-decoration: none; cursor: pointer; border: none;
      transition: transform 0.25s, box-shadow 0.3s, background 0.3s;
      min-height: 44px; min-width: 44px;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn-primary { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%); color: #fff; box-shadow: 0 2px 8px rgba(194, 65, 12, 0.2); }
    .btn-primary:hover { box-shadow: 0 4px 16px rgba(194, 65, 12, 0.3); }
